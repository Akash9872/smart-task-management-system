spring:
  config:
    import: optional:file:./application-local.properties
  application:
    name: smart-task-api
  datasource:
    url: "${DB_URL:jdbc:mysql://${DB_HOST:${TIDB_HOST:localhost}}:${DB_PORT:${TIDB_PORT:4000}}/${DB_NAME:${TIDB_DATABASE:${TIDB_DB_NAME:smart_task_db}}}?sslMode=VERIFY_IDENTITY&serverTimezone=UTC}"
    username: ${DB_USERNAME:${TIDB_USER:root}}
    password: ${DB_PASSWORD:${TIDB_PASSWORD:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  swagger-ui:
    path: /swagger-ui.html
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173,http://127.0.0.1:5173}
# Keep request bodies, credentials, and bearer tokens out of normal logs.
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
